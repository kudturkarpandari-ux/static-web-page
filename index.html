<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #172033;
      --muted: #6b7280;
      --border: #d9deea;
      --surface: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #dbeafe 0, transparent 34%),
        linear-gradient(135deg, #f8fafc, #eef2ff);
    }

    .login-card {
      width: min(420px, calc(100% - 32px));
      padding: 42px;
      border: 1px solid rgba(217, 222, 234, 0.85);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 20px 50px rgba(30, 64, 175, 0.12);
    }

    .brand {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 14px;
      color: white;
      background: var(--primary);
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
    }

    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.03em; }
    .subtitle { margin: 0 0 28px; color: var(--muted); }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;
      margin-bottom: 18px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      transition: border-color 160ms, box-shadow 160ms;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.11);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: -2px 0 22px;
      font-size: 14px;
    }

    .remember { display: flex; align-items: center; gap: 8px; }
    .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }

    a { color: var(--primary); text-decoration: none; font-weight: 700; }
    a:hover { text-decoration: underline; }

    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--primary);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
      transition: background 160ms, transform 160ms;
    }

    button:hover { background: var(--primary-hover); }
    button:active { transform: translateY(1px); }

    .signup { margin: 22px 0 0; text-align: center; color: var(--muted); font-size: 14px; }

    @media (max-width: 480px) {
      .login-card { padding: 30px 24px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand" aria-hidden="true">A</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required>

      <div class="options">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
    </form>

    <p class="signup">New here? <a href="#">Create an account</a></p>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      alert('Login submitted for ' + email);
    });
  </script>
</body>
</html>
